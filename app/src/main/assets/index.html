<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>123云盘</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <!-- 登录页 -->
  <div id="page-login" class="page hidden">
    <div class="login-wrap">
      <div class="login-logo">123<span>云盘</span></div>
      <div class="login-sub">移动端 · 复刻 123pan-open</div>

      <div class="login-tabs">
        <div class="login-tab active" data-logintab="qr">扫码登录</div>
        <div class="login-tab" data-logintab="pwd">账号登录</div>
      </div>

      <!-- 扫码登录 -->
      <div id="login-qr-panel" class="login-panel">
        <div class="qr-box">
          <img id="qr-img" alt="二维码" class="qr-img">
          <div id="qr-status" class="qr-status">点击下方刷新获取二维码</div>
        </div>
        <button id="qr-refresh" class="btn-primary">刷新二维码</button>
        <div class="qr-tip">使用微信或 123云盘 App 扫码，并确认登录</div>
      </div>

      <!-- 账号密码登录 -->
      <div id="login-pwd-panel" class="login-panel hidden">
        <div class="field">
          <label>账号</label>
          <input id="login-user" type="text" placeholder="手机号 / 邮箱" autocomplete="username">
        </div>
        <div class="field">
          <label>密码</label>
          <input id="login-pass" type="password" placeholder="请输入密码" autocomplete="current-password">
        </div>
        <button id="login-btn" class="btn-primary">登 录</button>
        <div id="login-msg" class="login-msg"></div>
      </div>
    </div>
  </div>

  <!-- 主框架 -->
  <div id="page-main" class="hidden">
    <header id="topbar">
      <span id="top-title">123云盘</span>
    </header>

    <!-- 内容区（文件 / 传输 / 我的 三个视图） -->
    <main id="content">
      <!-- 文件视图 -->
      <section id="view-files" class="view">
        <div id="breadcrumb"></div>
        <div id="file-list"></div>
        <!-- 底部工具栏：上传 / 新建 -->
        <div id="file-toolbar">
          <div class="tool-btn" id="tool-upload" data-tool="upload">
            <span class="tool-icon" data-icon="upload"></span><span>上传</span>
          </div>
          <div class="tool-sep"></div>
          <div class="tool-btn" id="tool-newfolder" data-tool="newfolder">
            <span class="tool-icon" data-icon="folder-plus"></span><span>新建</span>
          </div>
        </div>
      </section>

      <!-- 传输视图 -->
      <section id="view-transfers" class="view hidden">
        <div id="transfer-list"></div>
        <div class="panel-empty" id="transfer-empty">
          <div class="panel-icon" data-icon="download"></div>
          <p>暂无传输任务</p>
          <p class="panel-sub">下载的文件保存在系统下载目录</p>
        </div>
      </section>

      <!-- 回收站视图 -->
      <section id="view-recycle" class="view hidden">
        <div class="recycle-head">
          <span id="recycle-title">回收站</span>
          <button id="recycle-clear" class="recycle-clear-btn">清空</button>
        </div>
        <div id="recycle-list"></div>
        <div class="panel-empty" id="recycle-empty">
          <div class="panel-icon" data-icon="trash"></div>
          <p>回收站为空</p>
          <p class="panel-sub">删除的文件会先进入回收站</p>
        </div>
      </section>

      <!-- 我的视图 -->
      <section id="view-mine" class="view hidden">
        <div class="mine-card">
          <div class="mine-avatar" id="mine-avatar">用</div>
          <div class="mine-info">
            <div class="mine-name" id="mine-name">未登录</div>
            <div class="mine-id" id="mine-id"></div>
          </div>
        </div>
        <div class="mine-item" id="mine-quota"><span class="mine-label"><span class="mi-icon" data-icon="hdd"></span>存储空间</span><span class="mine-val" id="mine-quota-val">-</span></div>
        <div class="mine-item"><span class="mine-label"><span class="mi-icon" data-icon="info"></span>应用版本</span><span class="mine-val" id="mine-version">-</span></div>
        <button id="logout-btn" class="btn-danger">退出登录</button>
      </section>
    </main>

    <!-- 底部导航 -->
    <nav id="tabbar">
      <div class="tab active" data-view="files"><span class="tab-icon" data-icon="folder"></span><span>文件</span></div>
      <div class="tab" data-view="transfers"><span class="tab-icon" data-icon="arrow-down"></span><span>传输</span></div>
      <div class="tab" data-view="recycle"><span class="tab-icon" data-icon="trash"></span><span>回收站</span></div>
      <div class="tab" data-view="mine"><span class="tab-icon" data-icon="user"></span><span>我的</span></div>
    </nav>
  </div>
</div>

<!-- 操作菜单浮层 -->
<div id="action-sheet" class="sheet hidden">
  <div class="sheet-mask" data-close></div>
  <div class="sheet-panel">
    <div class="sheet-title" id="sheet-title"></div>
    <div class="sheet-grid" id="sheet-grid"></div>
    <div class="sheet-item cancel" data-close>取消</div>
  </div>
</div>

<!-- 重命名弹窗 -->
<div id="rename-modal" class="modal hidden">
  <div class="modal-mask" data-close></div>
  <div class="modal-panel">
    <div class="modal-title">重命名</div>
    <input id="rename-input" type="text">
    <div class="modal-btns">
      <button class="btn-plain" data-close>取消</button>
      <button id="rename-ok" class="btn-primary">确定</button>
    </div>
  </div>
</div>

<!-- 自定义确认弹窗（替代原生 confirm） -->
<div id="confirm-modal" class="modal hidden">
  <div class="modal-mask" data-close></div>
  <div class="modal-panel">
    <div class="modal-title" id="cf-title">提示</div>
    <div class="cf-message" id="cf-message"></div>
    <div class="modal-btns">
      <button class="btn-plain" data-close>取消</button>
      <button id="cf-ok" class="btn-primary danger">确定</button>
    </div>
  </div>
</div>

<!-- 新建文件夹弹窗 -->
<div id="newfolder-modal" class="modal hidden">
  <div class="modal-mask" data-close></div>
  <div class="modal-panel">
    <div class="modal-title">新建文件夹</div>
    <input id="newfolder-input" type="text" placeholder="请输入文件夹名称">
    <div class="modal-btns">
      <button class="btn-plain" data-close>取消</button>
      <button id="newfolder-ok" class="btn-primary">创建</button>
    </div>
  </div>
</div>

<!-- 创建分享配置面板（选有效期 + 分享形式） -->
<div id="share-config-modal" class="sheet hidden">
  <div class="sheet-mask" data-close></div>
  <div class="sheet-panel sc-panel">
    <div class="sc-handle"></div>
    <div class="sc-title">创建分享</div>
    <div class="sc-group">
      <div class="sc-group-title">有效期</div>
      <div class="sc-pills" id="sc-expire">
        <label class="sc-pill"><input type="radio" name="sc-expire" value="1"><span>1天</span></label>
        <label class="sc-pill"><input type="radio" name="sc-expire" value="2"><span>7天</span></label>
        <label class="sc-pill"><input type="radio" name="sc-expire" value="3"><span>30天</span></label>
        <label class="sc-pill"><input type="radio" name="sc-expire" value="4" checked><span>永久有效</span></label>
      </div>
    </div>
    <div class="sc-group">
      <div class="sc-group-title">分享形式</div>
      <div class="sc-pills" id="sc-pwd">
        <label class="sc-pill"><input type="radio" name="sc-pwd" value="2"><span>无提取码</span></label>
        <label class="sc-pill"><input type="radio" name="sc-pwd" value="1" checked><span>随机提取码</span></label>
        <label class="sc-pill"><input type="radio" name="sc-pwd" value="3"><span>自定义提取码</span></label>
        <label class="sc-pill"><input type="radio" name="sc-pwd" value="4"><span>直连分享</span></label>
      </div>
    </div>
    <div class="sc-custom hidden" id="sc-custom">
      <input id="sc-pwd-input" type="text" maxlength="4" placeholder="请输入4位提取码">
    </div>
    <div class="sc-btns">
      <button class="sc-btn cancel" data-close>取消</button>
      <button class="sc-btn primary" id="sc-create">创建分享</button>
    </div>
  </div>
</div>

<!-- 分享结果弹窗 -->
<div id="share-modal" class="modal hidden">
  <div class="modal-mask" data-close></div>
  <div class="modal-panel">
    <div class="modal-title" id="share-title">分享链接</div>
    <div class="share-box">
      <div class="share-link" id="share-link"></div>
    </div>
    <div class="share-pwd-row" id="share-pwd-row" style="display:none">
      <span class="share-pwd-label">提取码</span>
      <span class="share-pwd" id="share-pwd"></span>
    </div>
    <div class="modal-btns">
      <button class="btn-plain" data-close>关闭</button>
      <button id="share-copy" class="btn-primary">复制链接</button>
    </div>
  </div>
</div>

<!-- 上传文件隐藏输入 -->
<input type="file" id="upload-input" hidden multiple>

<!-- 隐藏的 SVG 图标定义 -->
<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <symbol id="i-upload" viewBox="0 0 24 24"><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2M12 3v12M7 8l5-5 5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-folder-plus" viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2zM12 11v6M9 14h6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-folder" viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol>
  <symbol id="i-arrow-down" viewBox="0 0 24 24"><path d="M12 3v12M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-user" viewBox="0 0 24 24"><path d="M20 21a8 8 0 0 0-16 0M12 13a5 5 0 1 0 0-10 5 5 0 0 0 0 10z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12M6 11l6 6 6-6M4 21h16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-rename" viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7M18.5 2.5a2.1 2.1 0 0 1 3 3L12 15l-4 1 1-4z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6zM10 11v6M14 11v6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-share" viewBox="0 0 24 24"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8M16 6l-4-4-4 4M12 2v13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
  <symbol id="i-hdd" viewBox="0 0 24 24"><path d="M3 13v3a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-3M3 13l2.5-7A2 2 0 0 1 7.4 5h9.2a2 2 0 0 1 1.9 1.4L21 13M3 13h18" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M8 17h8" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></symbol>
  <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 16v-4M12 8h.01" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
  <symbol id="i-doc" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M14 2v6h6M8 13h8M8 17h8" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></symbol>
  <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="8.5" cy="8.5" r="1.5" fill="currentColor"/><path d="M21 15l-5-5L5 21" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-video" viewBox="0 0 24 24"><rect x="2" y="6" width="14" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M16 10l6-4v12l-6-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol>
  <symbol id="i-audio" viewBox="0 0 24 24"><path d="M9 18V5l12-2v13" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><circle cx="6" cy="18" r="3" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="18" cy="16" r="3" fill="none" stroke="currentColor" stroke-width="2"/></symbol>
  <symbol id="i-archive" viewBox="0 0 24 24"><path d="M21 8l-9-5-9 5 9 5 9-5z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M3 8v8l9 5 9-5V8M12 13v8" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol>
  <symbol id="i-table" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M3 9h18M3 15h18M9 3v18" fill="none" stroke="currentColor" stroke-width="2"/></symbol>
  <symbol id="i-text" viewBox="0 0 24 24"><path d="M4 6V4h16v2M12 4v16M9 20h6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-code" viewBox="0 0 24 24"><path d="M8 6l-6 6 6 6M16 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-apk" viewBox="0 0 24 24"><path d="M5 3h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z" fill="none" stroke="currentColor" stroke-width="2"/><path d="M9 8h.01M15 8h.01M9 14h6a3 3 0 0 1-6 0z" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></symbol>
</svg>

<script src="app.js"></script>
</body>
</html>
