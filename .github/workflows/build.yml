name: Build & Release APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      # 计算版本号：tag 触发取 tag（去 v）；分支/手动触发用 dev-<run_number>
      - name: Compute version & release tag
        id: ver
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"          # 例如 v1.7.888
            VN="${TAG#v}"                          # 1.7.888
            PATCH="${VN##*.}"                      # 888
            echo "version_name=$VN" >> "$GITHUB_OUTPUT"
            echo "release_tag=$TAG" >> "$GITHUB_OUTPUT"
            echo "version_code=$(( 1000 + 10#$PATCH ))" >> "$GITHUB_OUTPUT"
          else
            echo "version_name=dev-${{ github.run_number }}" >> "$GITHUB_OUTPUT"
            echo "release_tag=dev-${{ github.run_number }}" >> "$GITHUB_OUTPUT"
            echo "version_code=$(( 1000 + ${{ github.run_number }} ))" >> "$GITHUB_OUTPUT"
          fi

      # 构建（正式签名 pan.keystore，来自 Secrets，保证可覆盖安装）
      - name: Build APK (signed)
        run: |
          chmod +x scripts/build.sh
          bash scripts/build.sh
        env:
          VERSION_CODE: ${{ steps.ver.outputs.version_code }}
          VERSION_NAME: ${{ steps.ver.outputs.version_name }}
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          ANDROID_KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: 123pan-mobile-apk
          path: build/*.apk
          if-no-files-found: error

      # 自动发布 Release：每次构建都发布到 Releases。用 gh CLI 创建，明确可诊断。
      #   全部发布为正式版（不带 prerelease）；正式 tag 触发额外标记为 latest
      - name: Publish Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG="${{ steps.ver.outputs.release_tag }}"
          ARGS=(--generate-notes --title "${{ steps.ver.outputs.version_name }}")
          # 全部正式发布。正式 tag(v*)再标记为 latest
          if [ "${{ github.ref_type }}" = "tag" ]; then
            ARGS+=(--latest)
          fi
          # 清理可能残留的同名 release/tag（异常时），保证能干净重发
          gh release delete "$TAG" --yes --cleanup-tag >/dev/null 2>&1 || true
          echo "==> gh release create $TAG ${ARGS[*]}"
          gh release create "$TAG" build/*.apk "${ARGS[@]}"
